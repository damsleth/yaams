name: publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      # Token-based publish via repo secret UV_PUBLISH_TOKEN. Mirrors the local
      # .env workflow (uv publish reads the same env var name) so the credential
      # lineage stays in one place across the owa-* / hugr / yaams siblings.
      # skip-existing makes the run idempotent: when a release is published
      # locally first, the tag-triggered run re-builds and harmlessly skips the
      # already-uploaded files instead of failing on "File already exists".
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.UV_PUBLISH_TOKEN }}
          skip-existing: true
