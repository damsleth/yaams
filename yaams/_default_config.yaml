# YAAMS configuration. Copy to config.yaml and fill in your own values.
# See README.md and .plans/ for what each block does.

db_path: ~/yaams/data.db

ingest:
  since: '2025-01-01T00:00:00Z'

  imessage:
    enabled: true
    chat_db_path: ~/Library/Messages/chat.db

  email:
    enabled: true
    sources:
      # Apple Mail .emlx tree (point at the newest ~/Library/Mail/Vxx)
      - type: emlx
        path: ~/Library/Mail/V10
      # Or one or more .mbox exports:
      # - type: mbox
      #   path: ~/Downloads/all-mail.mbox
    skip_newsletters: true
    # Emails From these addresses are always kept regardless of List-* headers
    # or noreply patterns. Add every address you send from across roles.
    user_addresses:
      - you@example.com

  # Personal Obsidian vault. One vault per source; honors frontmatter
  # `date:` / `created:` or YYYY-MM-DD filename prefixes for timestamps,
  # strips embeds/wikilinks/frontmatter before indexing. Set `vault_path`
  # via the `yaams sources` TUI or by editing it here.
  notes:
    enabled: false
    vault_path: ~/Documents/Obsidian
    # Optional. Directory names to skip anywhere in the vault tree.
    # Defaults to .obsidian, .git, .smartchats, .smart-env, .claude.
    # skip_dirs: [.obsidian, .git, archive]

  # Claude Code session summaries written by the capture-chat.sh SessionEnd
  # hook (one markdown file per session, with YAML frontmatter).
  chats:
    enabled: false
    chats_path: ~/brain/chats
    # Optional. Defaults to .git, .obsidian, .claude
    # skip_dirs: [.git, .obsidian]

  # Generic recursive folder ingestion. Reads .txt and .md natively;
  # .pdf needs `pip install pypdf`, .docx needs `pip install python-docx`.
  # Files of unsupported types (or types with the dep missing) are skipped.
  # Paths can be added/removed from the `yaams sources` TUI.
  folders:
    enabled: false
    paths: []
      # - ~/Documents/notes
      # - ~/work/specs
    # Optional. Defaults to .txt, .md, .markdown, .pdf, .docx
    # extensions: [.txt, .md, .pdf]
    # Optional. Directory names to skip anywhere in the tree.
    # skip_dirs: [.git, .obsidian, node_modules]

  # ---- Local Outlook.app (macOS) sources ----
  # Reads the CLASSIC Outlook for Mac store via AppleScript — offline, no Graph.
  # NOTE: "New Outlook" for Mac is NOT supported — its account data has no
  # AppleScript access, so these return nothing (a warning is logged). New
  # Outlook users should use the owa-piggy `mail`/`calendar` Graph sources below,
  # or toggle off "New Outlook" to fall back to Classic.
  outlook_calendar:
    enabled: false
  outlook_mail:
    enabled: false
    skip_newsletters: true

  # ---- Microsoft 365 / Graph sources ----
  # All M365 sources authenticate via owa-piggy. Configure profiles once with
  # `owa-piggy setup --profile <name>` and reference them by alias below.
  # `calendar` and `mail` are profile-keyed and produce one yaams source per
  # profile (e.g. mail_work, calendar_work). `teams` likewise.

  teams:
    enabled: false
    profiles:
      - work
    skip_bots: true
    page_size: 50

  # Teams *channel* posts (root + threaded replies), via `owa-teams`. Distinct
  # from `teams` above, which ingests 1:1/group/meeting *chats*. One source per
  # profile: teams_channels_<profile>.
  #
  # Cost: a run does 1 `owa-teams teams` + 1 `channels` call per team + 1
  # `messages` call per channel — an N+1 subprocess fan-out (a 20-team tenant
  # is ~300 spawns / minutes of wall-clock). Use the `teams` allowlist to
  # ingest only the teams you care about; leaving it empty walks every joined
  # team. Off by default for this reason.
  teams_channels:
    enabled: false
    profiles:
      - work
    # Team-id allowlist. [] = every joined team (see cost note above). Get ids
    # from `owa-teams teams --profile <p>`. An explicit list is recommended.
    teams: []
    # owa-teams `--limit`: pages of ~50 messages per channel, newest-first.
    limit_pages: 4
    skip_bots: true
    # Retries per owa-teams call when chatsvc rate-limits (429). The fan-out
    # bursts calls, so retries use exponential backoff (1, 2, 4, … capped 30s).
    # 0 disables retrying. A tighter `teams` allowlist is the better lever.
    max_retries: 5

  # owa-mail-backed inbox + sent ingestion. One source per profile.
  # `folders` defaults to [Inbox, SentItems] — add Archive/etc. if wanted.
  mail:
    enabled: false
    profiles:
      - work
    folders:
      - Inbox
      - SentItems
    skip_newsletters: true
    # Date range is sliced into chunks to stay under owa-mail's 200/req cap.
    chunk_days: 30
    # Addresses you send from. Messages From these are never filtered as
    # newsletters/automated even if subject patterns would otherwise match.
    user_addresses: []
      # - you@example.com

  # calendar:
  #   enabled: false
  #   profiles:
  #     - work
  #   skip_free: true

embed:
  model: BAAI/bge-m3
  batch_size: 32
  # Apple Silicon: mps. Otherwise: cpu. CUDA also works if torch sees it.
  device: mps
  dimension: 1024
  # Use only the locally cached HF snapshot; no network calls per run.
  # Set to false the first time you change `model` so the new weights download.
  offline: true
  # Where HF stores model weights (sets HF_HOME). Defaults to
  # ~/.local/share/huggingface so multi-GB weights survive `~/.cache` wipes.
  # Respects an externally set $HF_HOME if you'd rather configure it that way.
  # models_dir: ~/.local/share/huggingface

# LLM backend for synthesis (and future query parsing).
# Used by `yaams query --answer ...`. Off by default (dummy backend); pick
# one of:
#   backend: ollama       # local Ollama server
#     model: llama3.1
#     host: http://localhost:11434
#   backend: subprocess   # any CLI that takes prompt on stdin and prints answer
#     command: ["codex", "exec", "--prompt-stdin"]
#     # or: ["claude", "-p"]
#   backend: dummy        # no synthesis (also default if section omitted)
synth:
  backend: dummy

# Post-ingest summary: after `yaams ingest` stores new items, an LLM agent
# writes a holistic, topic-grouped digest of what just landed and prints it
# (and files it into the cognitive-ledger inbox for fact promotion). On by
# default; set enabled: false to turn off.
summary:
  enabled: true
  # claude | codex | ollama | subprocess | dummy | synth
  # `synth` reuses synth.backend above; `claude` drives the local `claude` CLI
  # and works out of the box. dummy / a missing CLI just skips with a note.
  backend: claude
  model:                 # backend default if unset (e.g. claude's default)
  timeout: 180
  max_items: 400         # cap new items fed to the summary prompt
  content_chars: 300     # per-item content truncation
  to_inbox: true         # also drop the digest into the ledger 00_inbox
  safe_mode: true        # claude backend: pass --safe-mode so the user's global
                         # CLAUDE.md / skills / hooks don't leak into the digest

trust:
  # Attach a display-only trust verdict (high|medium|low + reason) to each
  # query result. Never affects ranking or result order.
  show_trust_verdict: true
  # Discount a result's confidence by its provenance class (source channel)
  # when deriving the verdict. Off by default until A/B validated; flip on to
  # let conversational/imported sources read as lower trust than authored ones.
  provenance_weighting_enabled: false

promote:
  semantic_dedup:
    enabled: false
    duplicate_threshold: 0.92
    merge_threshold: 0.80
    embed_backend: local
    ledger_cli: ledger
    timeout_s: 15
  conflict_detection:
    enabled: false
    only_for_merge_band: true
    confidence_threshold: 0.7

entities:
  spacy_model: xx_ent_wiki_sm
  # Optional Norwegian-trained NER model; Norwegian-looking content routes to
  # it instead. Uncomment and run `yaams setup` to install.
  # spacy_model_nb: nb_core_news_md
  # The entity dictionary (curated names + aliases used for tagging) lives in
  # its own JSON file, not inline here — keeping a growing data list out of
  # this hand-edited config. A relative path is resolved next to data.db; this
  # value is also the default when the key is omitted. Manage entries with
  # `yaams entities add|import-people|merge|discover` rather than editing by
  # hand. Example entities.json:
  #   [
  #     {"canonical": "Example Person", "type": "person", "aliases": ["Ex", "E. Person"]},
  #     {"canonical": "Example Org", "type": "org", "aliases": ["EX"]}
  #   ]
  dictionary_path: entities.json

# Retrieval tuning.
retrieve:
  # Cross-lingual and domain synonym groups for FTS query expansion.
  # Each entry is a list of interchangeable terms; any term in a group expands
  # to the full set at query time.  Entity aliases from the entity dictionary
  # are also loaded automatically — these groups cover concepts that aren't
  # named entities, including Norwegian<->English equivalents.
  synonyms:
    - [vakt, shift]           # NO<->EN: work shift / duty period
    - [øvelse, exercise]      # NO<->EN: training exercise / drill
    - [hytte, cabin]          # NO<->EN: cabin / mountain hut
